<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Review Agent</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border: #30363d;
            --btn-bg: #238636;
            --btn-hover: #2ea043;
            --btn-disabled: #1b4721;
            --input-bg: #010409;
            
            --high-sev: #f85149;
            --high-bg: rgba(248, 81, 73, 0.1);
            --med-sev: #d29922;
            --med-bg: rgba(210, 153, 34, 0.1);
            --low-sev: #58a6ff;
            --low-bg: rgba(88, 166, 255, 0.1);
            
            --approve: #3fb950;
            --changes: #f85149;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 20px; 
            line-height: 1.6; 
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            width: 40px;
            height: 40px;
            margin-right: 15px;
            fill: var(--text-main);
        }

        h1 { margin: 0; font-size: 24px; font-weight: 600; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 15px; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            font-size: 14px;
        }
        
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 10px 12px; 
            box-sizing: border-box; 
            background-color: var(--input-bg);
            border: 1px solid var(--border); 
            border-radius: 6px; 
            color: var(--text-main);
            font-size: 14px;
        }
        
        input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        details {
            margin-bottom: 20px;
        }
        
        summary {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            user-select: none;
        }

        .token-field {
            margin-top: 10px;
        }

        button { 
            padding: 8px 16px; 
            background-color: var(--btn-bg); 
            color: #ffffff; 
            border: 1px solid rgba(240, 246, 252, 0.1); 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        
        button:hover:not(:disabled) { background-color: var(--btn-hover); }
        button:disabled { 
            background-color: var(--btn-disabled); 
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed; 
        }

        /* Spinner */
        .loader-container {
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 40px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--text-muted);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error { 
            color: var(--high-sev); 
            padding: 15px; 
            border: 1px solid var(--high-sev); 
            background-color: var(--high-bg); 
            border-radius: 6px; 
            margin-top: 20px; 
        }

        /* Results */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .stats-item strong { color: var(--text-main); }
        .additions { color: var(--approve); }
        .deletions { color: var(--changes); }

        .verdict-banner {
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid transparent;
        }
        
        .verdict-banner.approve {
            background-color: rgba(63, 185, 80, 0.1);
            border-color: var(--approve);
        }
        
        .verdict-banner.changes {
            background-color: rgba(248, 81, 73, 0.1);
            border-color: var(--changes);
        }

        .verdict-title {
            font-size: 24px;
            font-weight: bold;
            margin: 0 0 10px 0;
        }
        
        .verdict-title.approve { color: var(--approve); }
        .verdict-title.changes { color: var(--changes); }

        .verdict-reason {
            font-size: 16px;
            color: var(--text-main);
            margin: 0;
        }

        h2, h3 { margin-top: 0; color: var(--text-main); border-bottom: 1px solid var(--border); padding-bottom: 8px;}

        .issue { 
            border-left: 4px solid transparent; 
            padding: 12px 15px; 
            margin-bottom: 12px; 
            background: var(--input-bg); 
            border-radius: 0 6px 6px 0;
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        
        .issue.high { border-left-color: var(--high-sev); }
        .issue.medium { border-left-color: var(--med-sev); }
        .issue.low { border-left-color: var(--low-sev); }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 8px;
        }
        
        .badge.high { background-color: var(--high-bg); color: var(--high-sev); border: 1px solid var(--high-sev); }
        .badge.medium { background-color: var(--med-bg); color: var(--med-sev); border: 1px solid var(--med-sev); }
        .badge.low { background-color: var(--low-bg); color: var(--low-sev); border: 1px solid var(--low-sev); }

        .issue-file {
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            font-size: 13px;
            color: var(--text-muted);
            background: rgba(240, 246, 252, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .issue-comment { margin-top: 8px; font-size: 14px; }

        ul { padding-left: 20px; }
        li { margin-bottom: 8px; }

        @media (max-width: 600px) {
            .stats-bar { flex-direction: column; gap: 5px; }
        }
    </style>
</head>
<body>
    <header>
        <svg class="logo" viewBox="0 0 16 16" version="1.1" aria-hidden="true">
            <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        <h1>PR Review Agent</h1>
    </header>
    
    <div class="card">
        <div class="form-group">
            <label for="pr_url">GitHub PR URL</label>
            <input type="text" id="pr_url" placeholder="e.g. https://github.com/fastapi/fastapi/pull/1">
        </div>
        
        <details>
            <summary>Advanced Options</summary>
            <div class="form-group token-field">
                <label for="github_token">GitHub Token (Optional)</label>
                <input type="password" id="github_token" placeholder="ghp_... (For private repos or rate limits)">
            </div>
        </details>
        
        <button id="submitBtn" onclick="submitReview()">Review PR</button>
    </div>
    
    <div id="loading" class="loader-container">
        <div class="spinner"></div>
        <div>Fetching PR data and running AI review...</div>
    </div>
    
    <div id="result"></div>

    <script>
        async function submitReview() {
            const prUrl = document.getElementById('pr_url').value.trim();
            const githubToken = document.getElementById('github_token').value.trim();
            const btn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('result');
            
            if (!prUrl) {
                alert('Please enter a PR URL');
                return;
            }

            btn.disabled = true;
            loading.style.display = 'flex';
            resultDiv.innerHTML = '';

            try {
                const response = await fetch('/review', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pr_url: prUrl, github_token: githubToken || null })
                });

                const data = await response.json();
                
                if (response.ok) {
                    displayReview(data);
                } else {
                    resultDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${data.detail || 'Unknown error occurred'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error"><strong>Network Error:</strong> ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
        
        function displayReview(data) {
            const meta = data.metadata;
            const rev = data.review;
            
            const isApproved = rev.verdict === 'APPROVE';
            const verdictClass = isApproved ? 'approve' : 'changes';
            const verdictIcon = isApproved ? '✅' : '🔄';
            
            let html = `
                <div class="card">
                    <h2>${escapeHtml(meta.title)} <span style="color: var(--text-muted); font-weight: normal;">#${meta.commits} commits</span></h2>
                    
                    <div class="stats-bar">
                        <div class="stats-item">Author: <strong>${escapeHtml(meta.author)}</strong></div>
                        <div class="stats-item">Files changed: <strong>${meta.changed_files}</strong></div>
                        <div class="stats-item additions">+${meta.additions} additions</div>
                        <div class="stats-item deletions">-${meta.deletions} deletions</div>
                    </div>
                </div>
                
                <div class="verdict-banner ${verdictClass}">
                    <div class="verdict-title ${verdictClass}">${verdictIcon} ${escapeHtml(rev.verdict)}</div>
                    <p class="verdict-reason">${escapeHtml(rev.verdict_reason)}</p>
                </div>
                
                <div class="card">
                    <h3>Summary</h3>
                    <p>${escapeHtml(rev.summary)}</p>
                </div>
            `;
            
            if (rev.issues && rev.issues.length > 0) {
                html += `<div class="card"><h3>Issues Found</h3>`;
                rev.issues.forEach(issue => {
                    const sev = (issue.severity || 'low').toLowerCase();
                    const sevDisplay = sev.charAt(0).toUpperCase() + sev.slice(1);
                    html += `
                        <div class="issue ${sev}">
                            <div>
                                <span class="badge ${sev}">${sevDisplay}</span>
                                <span class="issue-file">${escapeHtml(issue.file || 'General')}</span>
                            </div>
                            <div class="issue-comment">${escapeHtml(issue.comment)}</div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            
            if (rev.suggestions && rev.suggestions.length > 0) {
                html += `<div class="card"><h3>Suggestions</h3><ul>`;
                rev.suggestions.forEach(s => {
                    html += `<li>${escapeHtml(s)}</li>`;
                });
                html += `</ul></div>`;
            }
            
            document.getElementById('result').innerHTML = html;
        }
        
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                 .toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
